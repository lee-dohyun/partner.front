name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        # Dependabot PR 에는 저장소 시크릿이 전달되지 않는다(gateway#209).
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # target 을 명시한다 — admin.front 는 이게 빠져 프로덕션에 next dev 가 떠 있었다(2026-07-31).
      # 이 저장소 Dockerfile 은 마지막 스테이지가 production 이라 이중 방어다.
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'ci-local' }}/partner.front:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'ci-local' }}/partner.front:${{ github.sha }}

      - name: Run Trivy vulnerability scanner
        if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME || 'ci-local' }}/partner.front:${{ github.sha }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0"

      - name: Upload Trivy scan results as workflow artifact
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: trivy-results-${{ github.sha }}
          path: trivy-results.sarif
          retention-days: 30

  deploy:
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: [self-hosted, k3s-home, partner-front]

    steps:
      - name: Deploy new image to K3s
        run: |
          /usr/local/bin/kubectl --kubeconfig=/home/leedohyun/.kube-ci/partner-front-deployer.kubeconfig \
            set image deployment/partner-front partner-front=leedohyun1985/partner.front:${{ github.sha }} -n customer

      - name: Wait for rollout
        run: |
          /usr/local/bin/kubectl --kubeconfig=/home/leedohyun/.kube-ci/partner-front-deployer.kubeconfig \
            rollout status deployment/partner-front -n customer --timeout=600s
